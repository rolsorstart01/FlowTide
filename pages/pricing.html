<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing | FlowTide</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/legal.css">
    <link rel="stylesheet" href="../css/pricing.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

    <header class="navbar">
        <div class="container">
            <a href="/" class="logo"><img src="../Images/Logo/logo.png" alt="FlowTide Logo"></a>
            <input type="checkbox" id="menu-btn" class="menu-btn">
            <label for="menu-btn" class="menu-icon"><span class="navicon"></span></label>
            <nav>
                <ul>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero" style="padding: 60px 0 20px 0; text-align: center;">
            <h1 style="color: white; font-size: 3rem;">Simple, Scalable Pricing.</h1>
            <p style="color: white; opacity: 0.8;">Choose the plan that fits your wants and needs.</p>
        </section>

        <section class="pricing-section">
            <div class="pricing-grid">
                <div class="pricing-card">
                    <h3>Starter</h3>
                    <div class="price">₹<span id="s-price">500</span><span>/mo</span></div>
                    <div class="slider-container">
                        <label>Storage: <span id="s-storage-val">5</span>GB</label>
                        <input type="range" min="5" max="50" value="5" class="slider" id="s-storage">
                        <label>API Tokens: <span id="s-api-val">1</span>M</label>
                        <input type="range" min="1" max="10" value="1" class="slider" id="s-api">
                    </div>
                    <button class="btn btn-outline" onclick="initiateUpgrade('Starter')">Get Started</button>
                </div>

                <div class="pricing-card popular">
                    <span class="badge">Most Popular</span>
                    <h3>Professional</h3>
                    <div class="price">₹<span id="p-price">1500</span><span>/mo</span></div>
                    <div class="slider-container">
                        <label>Storage: <span id="p-storage-val">10</span>GB</label>
                        <input type="range" min="10" max="100" value="10" class="slider" id="p-storage">
                        <label>API Tokens: <span id="p-api-val">1</span>M</label>
                        <input type="range" min="1" max="20" value="1" class="slider" id="p-api">
                    </div>
                    <button class="btn btn-full" onclick="initiateUpgrade('Professional')">Upgrade Now</button>
                </div>

                <div class="pricing-card">
                    <h3>Enterprise</h3>
                    <div class="price">₹<span id="e-price">2500</span><span>/mo</span></div>
                    <div class="slider-container">
                        <label>Storage: <span id="e-storage-val">50</span>GB</label>
                        <input type="range" min="50" max="500" value="50" class="slider" id="e-storage">
                        <label>API Tokens: <span id="e-api-val">5</span>M</label>
                        <input type="range" min="5" max="100" step="5" value="5" class="slider" id="e-api">
                    </div>
                    <button class="btn btn-outline" onclick="initiateUpgrade('Enterprise')">Upgrade Now</button>
                </div>
            </div>
        </section>
    </main>

    <div id="auth-modal" class="popup-overlay"
        style="display: none; z-index: 10001; background: rgba(0,0,0,0.5); position: fixed; top: 0; left: 0; width: 100%; height: 100%; align-items: center; justify-content: center;">
        <div class="popup-content"
            style="max-width: 400px; width: 90%; background: white; color: #333; padding: 40px; border-radius: 12px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">

            <button class="close-btn" onclick="closeAuthModal()"
                style="position: absolute; right: 20px; top: 20px; border: none; background: none; font-size: 24px; cursor: pointer; color: #888;">&times;</button>

            <h2 id="auth-title" style="text-align: center; margin-bottom: 25px; font-family: sans-serif;">Welcome to
                FlowTide</h2>

            <button onclick="loginWithGoogle()" class="btn-google"
                style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; background: white; color: #3c4043; border: 1px solid #dadce0; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 500; font-family: 'Roboto', sans-serif; transition: background 0.2s;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18"
                    alt="Google">
                Continue with Google
            </button>

            <div style="display: flex; align-items: center; margin: 20px 0;">
                <div style="flex: 1; height: 1px; background: #eee;"></div>
                <span style="margin: 0 10px; color: #999; font-size: 14px;">or</span>
                <div style="flex: 1; height: 1px; background: #eee;"></div>
            </div>

            <div id="auth-form">
                <input type="email" id="auth-email" placeholder="Email" class="form-input"
                    style="width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none;">

                <input type="password" id="auth-password" placeholder="Password" class="form-input"
                    style="width: 100%; box-sizing: border-box; margin-bottom: 20px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; outline: none;">

                <button id="auth-submit" class="btn btn-full"
                    style="width: 100%; padding: 12px; background: #00d2ff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Login</button>

                <p id="auth-toggle"
                    style="margin-top: 20px; cursor: pointer; text-align: center; color: #00d2ff; font-size: 14px; font-weight: 500;">
                    Don't have an account? Sign Up
                </p>
            </div>
        </div>
    </div>
    <script type="module">
        import { processPayment, handleLogin, handleSignUp, auth, db } from '../js/script.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- 1. SLIDER CALCULATIONS ---
        // This replicates the logic in script.js to ensure the UI updates
        const setupLocalSlider = (planId, margin, storageRate, apiRate) => {
            const sSlider = document.getElementById(`${planId}-storage`);
            const aSlider = document.getElementById(`${planId}-api`);
            const sDisplay = document.getElementById(`${planId}-storage-val`);
            const aDisplay = document.getElementById(`${planId}-api-val`);
            const pDisplay = document.getElementById(`${planId}-price`);

            if (!sSlider || !aSlider || !pDisplay) return;

            const update = () => {
                const sVal = parseInt(sSlider.value);
                const aVal = parseInt(aSlider.value);
                if (sDisplay) sDisplay.innerText = sVal;
                if (aDisplay) aDisplay.innerText = aVal;

                const total = margin + (sVal * storageRate) + (aVal * apiRate);
                pDisplay.innerText = total.toLocaleString('en-IN');
            };

            sSlider.oninput = update;
            aSlider.oninput = update;
            update();
        };

        // Initialize the sliders for your three cards
        setupLocalSlider('s', 500, 10, 50);   // Starter
        setupLocalSlider('p', 1500, 8, 40);  // Professional
        setupLocalSlider('e', 2500, 5, 30);  // Enterprise

        // --- 2. UPGRADE HOOK ---
        window.initiateUpgrade = (plan) => {
            const prefix = plan === 'Starter' ? 's' : (plan === 'Professional' ? 'p' : 'e');
            const priceElement = document.getElementById(`${prefix}-price`);
            const amount = parseInt(priceElement.innerText.replace(/,/g, ''));

            processPayment(plan, amount);
        };

        // --- 3. AUTH MODAL LOGIC (Already yours, kept for completeness) ---
        let isLogin = true;
        const toggle = document.getElementById('auth-toggle');
        const submit = document.getElementById('auth-submit');
        const title = document.getElementById('auth-title');

        toggle.onclick = () => {
            isLogin = !isLogin;
            title.innerText = isLogin ? "Welcome Back" : "Create Account";
            submit.innerText = isLogin ? "Login" : "Sign Up";
            toggle.innerText = isLogin ? "Need an account? Sign Up" : "Already have an account? Login";
        };

        submit.onclick = () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            isLogin ? handleLogin(email, pass) : handleSignUp(email, pass);
        };
    </script>

</body>

</html>
