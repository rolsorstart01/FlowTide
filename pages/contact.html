<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | FlowTide</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="container">
            <a href="#" class="logo"><img src="../Images/Logo/logo.png" alt="FlowTide Logo"></a>

            <input type="checkbox" id="menu-btn" class="menu-btn">
            <label for="menu-btn" class="menu-icon">
                <span class="navicon"></span>
            </label>

            <nav>
                <ul>
                    <li><a href="../pages/home.html">Home</a></li>
                    <li><a href="../pages/services.html">Services</a></li>
                    <li><a href="../pages/contact.html">Contact</a></li>
                    <li><a href="../pages/pricing.html">Pricing</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contact-page">
        <section class="container">
            <div class="contact-header">
                <h1>Get in Touch</h1>
                <p>Have a question or want to work together? Drop us a message.</p>
            </div>

            <div class="contact-grid">
                <div class="contact-info">
                    <div class="info-item">
                        <h3>Email Us</h3>
                        <a href="https://mail.google.com/mail/u/0/#inbox?compose=CllgCHrkVwVWzTtVJLcSTLWHdnZSjtHTpbdsmVhMmSqkVMJWCFDflvVSfmBLkgljfFfdhDrCCXq"
                            target="_blank">flowtide.in@gmail.com</a>
                    </div>
                    <div class="info-item">
                        <div class="social-links">
                            <a href="https://www.instagram.com/flowtide.in/" target="_blank"><img
                                    src="../Images/Logo/Insta.png" alt="Instagram" class="social-icon"></a>
                            <a href="https://wa.me/918336939882" target="_blank"><img src="../Images/Logo/whatsapp.png"
                                    alt="Whatsapp" class="social-icon"></a>
                        </div>
                    </div>
                </div>

                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="How can we help?" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </section>
    </main>
    <div id="contact-success-overlay" class="popup-overlay" style="display: none;">
        <div class="popup-content">
            <div class="success-icon">✔</div>
            <h2>Message Sent!</h2>
            <p>Thank you! We have received your message and will get back to you shortly.</p>
            <button id="close-contact-popup" class="submit-btn">Close</button>
        </div>
    </div>
    <script type="module" src="../js/script.js"></script>
</body>

</html>
